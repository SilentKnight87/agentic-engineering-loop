name: quality
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # privacy-allow: public GitHub Action reference
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4 # privacy-allow: public GitHub Action reference
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: npm ci
      - run: npm run quality
